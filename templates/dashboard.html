<!DOCTYPE html>
<html>
<head>
<title>IoT Live Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI;
    background:
        linear-gradient(
            135deg,
            #08111f,
            #102544
        );
    color:white;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

h1{
    text-align:center;
    color:#49c5ff;
    margin-bottom:25px;
    font-size:42px;
}

.top{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:30px;
    box-shadow:
        0 8px 30px rgba(0,0,0,.35);
}

.metric{
    width:280px;
    text-align:center;
}

.metric h2{
    font-size:18px;
    color:#b8dfff;
    margin-bottom:15px;
}

.value{
    font-size:52px;
    font-weight:700;
}

.temp{
    color:#ff6b6b;
}

.hum{
    color:#49c5ff;
}

.status{
    color:#00ff88;
    font-weight:600;
    margin-top:10px;
}

.updated{
    margin-top:12px;
    color:#cdd6e0;
    font-size:14px;
}

.chart-card{
    margin-top:30px;
}

canvas{
    background:white;
    border-radius:15px;
    padding:10px;
}

</style>
</head>

<body>

<div class="container">

    <h1>IoT Monitoring Dashboard</h1>

    <div class="top">

        <div class="card metric">
            <h2>Temperature</h2>
            <div id="temp"
                 class="value temp">--</div>
        </div>

        <div class="card metric">
            <h2>Humidity</h2>
            <div id="hum"
                 class="value hum">--</div>
        </div>

        <div class="card metric">
            <h2>Device Status</h2>
            <div id="status"
                 class="status">
                 Checking...
            </div>

            <div id="updated"
                 class="updated"></div>
        </div>

    </div>

    <div class="card chart-card">

        <canvas id="chart"></canvas>

    </div>

</div>

<script>

let chart;

async function updateDashboard(){

    // Latest data
    const latest =
        await fetch('/latest');

    const data =
        await latest.json();

    document.getElementById(
        'temp'
    ).innerHTML =
        data.temperature + " °C";

    document.getElementById(
        'hum'
    ).innerHTML =
        data.humidity + " %";

    document.getElementById(
        'updated'
    ).innerHTML =
        "Updated: " +
        data.created_at;

    // online status
    document.getElementById(
        'status'
    ).innerHTML =
        "🟢 Online";

    // history
    const history =
        await fetch('/history');

    const h =
        await history.json();

    const labels =
        h.map(x =>
            x.time.substring(11,19)
        );

    const temp =
        h.map(x =>
            x.temperature
        );

    const hum =
        h.map(x =>
            x.humidity
        );

    if(chart){
        chart.destroy();
    }

    chart =
        new Chart(
            document.getElementById(
                'chart'
            ),
            {
                type:'line',
                data:{
                    labels:labels,
                    datasets:[
                        {
                            label:'Temperature',
                            data:temp,
                            borderColor:'#ff5252',
                            tension:.35
                        },
                        {
                            label:'Humidity',
                            data:hum,
                            borderColor:'#2196f3',
                            tension:.35
                        }
                    ]
                },
                options:{
                    responsive:true,
                    animation:true
                }
            }
        );
}

updateDashboard();

// Smooth live updates
setInterval(
    updateDashboard,
    5000
);

</script>

</body>
</html>
